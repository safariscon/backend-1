name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: safariscon-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Docker image build
        run: docker build -t safariscon-api:${{ github.sha }} .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "Dockerfile,.dockerignore,docker-compose.yml,package.json,package-lock.json,src"
          target: "/opt/safariscon-api"
          rm: true

      - name: Build and run Docker image on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          NODE_ENV: production
          PORT: ${{ secrets.PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_DIRECT: ${{ secrets.MONGODB_URI_DIRECT }}
          MONGODB_PREFER_DIRECT: ${{ secrets.MONGODB_PREFER_DIRECT }}
          MONGODB_STORAGE_LIMIT_MB: ${{ secrets.MONGODB_STORAGE_LIMIT_MB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          JWT_ACCESS_TTL_SECONDS: ${{ secrets.JWT_ACCESS_TTL_SECONDS }}
          JWT_REFRESH_TTL_SECONDS: ${{ secrets.JWT_REFRESH_TTL_SECONDS }}
          AUTH_OTP_EXPIRY_MINUTES: ${{ secrets.AUTH_OTP_EXPIRY_MINUTES }}
          AUTH_OTP_RESEND_COOLDOWN_SECONDS: ${{ secrets.AUTH_OTP_RESEND_COOLDOWN_SECONDS }}
          AUTH_OTP_MAX_ATTEMPTS: ${{ secrets.AUTH_OTP_MAX_ATTEMPTS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          FLUTTER_WEB_URL: ${{ secrets.FLUTTER_WEB_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          PUBLIC_FRONTEND_URL: ${{ secrets.PUBLIC_FRONTEND_URL }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          CLOUDINARY_STORAGE_LIMIT_GB: ${{ secrets.CLOUDINARY_STORAGE_LIMIT_GB }}
          CLOUDINARY_BANDWIDTH_LIMIT_GB: ${{ secrets.CLOUDINARY_BANDWIDTH_LIMIT_GB }}
          PLATFORM_COMMISSION_RATE: ${{ secrets.PLATFORM_COMMISSION_RATE }}
          PHOTON_BASE_URL: ${{ secrets.PHOTON_BASE_URL }}
          OSRM_BASE_URL: ${{ secrets.OSRM_BASE_URL }}
          GEO_USER_AGENT: ${{ secrets.GEO_USER_AGENT }}
          GEO_TIMEOUT_MS: ${{ secrets.GEO_TIMEOUT_MS }}
          GEO_PROVIDER: ${{ secrets.GEO_PROVIDER }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          XENTRIPAY_ENV: ${{ secrets.XENTRIPAY_ENV }}
          XENTRIPAY_API_KEY: ${{ secrets.XENTRIPAY_API_KEY }}
          XENTRIPAY_BASE_URL: ${{ secrets.XENTRIPAY_BASE_URL }}
          XENTRIPAY_CURRENCY: ${{ secrets.XENTRIPAY_CURRENCY }}
          XENTRIPAY_MIN_AMOUNT: ${{ secrets.XENTRIPAY_MIN_AMOUNT }}
          XENTRIPAY_CHARGES_INCLUDED: ${{ secrets.XENTRIPAY_CHARGES_INCLUDED }}
          XENTRIPAY_MERCHANT_NAME: ${{ secrets.XENTRIPAY_MERCHANT_NAME }}
          XENTRIPAY_MERCHANT_EMAIL: ${{ secrets.XENTRIPAY_MERCHANT_EMAIL }}
          XENTRIPAY_MERCHANT_PHONE: ${{ secrets.XENTRIPAY_MERCHANT_PHONE }}
          XENTRIPAY_COLLECTION_REDIRECT_URL: ${{ secrets.XENTRIPAY_COLLECTION_REDIRECT_URL }}
          XENTRIPAY_COLLECTION_RETURN_URL: ${{ secrets.XENTRIPAY_COLLECTION_RETURN_URL }}
          XENTRIPAY_CHECKOUT_FINAL_URL: ${{ secrets.XENTRIPAY_CHECKOUT_FINAL_URL }}
          XENTRIPAY_SIMULATE_SUCCESS: ${{ secrets.XENTRIPAY_SIMULATE_SUCCESS }}
          MAILER_HOST: ${{ secrets.MAILER_HOST }}
          MAILER_PORT: ${{ secrets.MAILER_PORT }}
          MAILER_PRODUCER_EMAIL: ${{ secrets.MAILER_PRODUCER_EMAIL }}
          MAILER_PRODUCER_PASSWORD: ${{ secrets.MAILER_PRODUCER_PASSWORD }}
          MAILER_REJECT_UNAUTHORIZED: ${{ secrets.MAILER_REJECT_UNAUTHORIZED }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: NODE_ENV,PORT,MONGODB_URI,MONGODB_URI_DIRECT,MONGODB_PREFER_DIRECT,MONGODB_STORAGE_LIMIT_MB,JWT_SECRET,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,JWT_ACCESS_TTL_SECONDS,JWT_REFRESH_TTL_SECONDS,AUTH_OTP_EXPIRY_MINUTES,AUTH_OTP_RESEND_COOLDOWN_SECONDS,AUTH_OTP_MAX_ATTEMPTS,ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_NAME,CORS_ORIGINS,CLIENT_URL,FLUTTER_WEB_URL,FRONTEND_URL,PUBLIC_FRONTEND_URL,PUBLIC_API_URL,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_FOLDER,CLOUDINARY_STORAGE_LIMIT_GB,CLOUDINARY_BANDWIDTH_LIMIT_GB,PLATFORM_COMMISSION_RATE,PHOTON_BASE_URL,OSRM_BASE_URL,GEO_USER_AGENT,GEO_TIMEOUT_MS,GEO_PROVIDER,GOOGLE_MAPS_API_KEY,XENTRIPAY_ENV,XENTRIPAY_API_KEY,XENTRIPAY_BASE_URL,XENTRIPAY_CURRENCY,XENTRIPAY_MIN_AMOUNT,XENTRIPAY_CHARGES_INCLUDED,XENTRIPAY_MERCHANT_NAME,XENTRIPAY_MERCHANT_EMAIL,XENTRIPAY_MERCHANT_PHONE,XENTRIPAY_COLLECTION_REDIRECT_URL,XENTRIPAY_COLLECTION_RETURN_URL,XENTRIPAY_CHECKOUT_FINAL_URL,XENTRIPAY_SIMULATE_SUCCESS,MAILER_HOST,MAILER_PORT,MAILER_PRODUCER_EMAIL,MAILER_PRODUCER_PASSWORD,MAILER_REJECT_UNAUTHORIZED
          script: |
            set -eo pipefail
            cd /opt/safariscon-api
            umask 077
            cat > .env <<EOF
            NODE_ENV=production
            PORT=${PORT:-10000}
            REQUIRE_DB_ON_STARTUP=true
            MONGODB_URI=${MONGODB_URI}
            MONGODB_URI_DIRECT=${MONGODB_URI_DIRECT}
            MONGODB_PREFER_DIRECT=${MONGODB_PREFER_DIRECT:-true}
            MONGODB_STORAGE_LIMIT_MB=${MONGODB_STORAGE_LIMIT_MB:-512}
            JWT_SECRET=${JWT_SECRET}
            JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-2h}
            JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-1d}
            JWT_ACCESS_TTL_SECONDS=${JWT_ACCESS_TTL_SECONDS:-7200}
            JWT_REFRESH_TTL_SECONDS=${JWT_REFRESH_TTL_SECONDS:-86400}
            AUTH_OTP_EXPIRY_MINUTES=${AUTH_OTP_EXPIRY_MINUTES:-10}
            AUTH_OTP_RESEND_COOLDOWN_SECONDS=${AUTH_OTP_RESEND_COOLDOWN_SECONDS:-60}
            AUTH_OTP_MAX_ATTEMPTS=${AUTH_OTP_MAX_ATTEMPTS:-5}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            ADMIN_NAME=${ADMIN_NAME}
            SEED_ADMIN_EMAIL=${ADMIN_EMAIL}
            SEED_ADMIN_PASSWORD=${ADMIN_PASSWORD}
            SEED_ADMIN_NAME=${ADMIN_NAME}
            CORS_ORIGINS=${CORS_ORIGINS}
            CLIENT_URL=${CLIENT_URL}
            FLUTTER_WEB_URL=${FLUTTER_WEB_URL}
            FRONTEND_URL=${FRONTEND_URL}
            PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
            PUBLIC_API_URL=${PUBLIC_API_URL}
            CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
            CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-safariservconn}
            CLOUDINARY_STORAGE_LIMIT_GB=${CLOUDINARY_STORAGE_LIMIT_GB:-25}
            CLOUDINARY_BANDWIDTH_LIMIT_GB=${CLOUDINARY_BANDWIDTH_LIMIT_GB:-25}
            PLATFORM_COMMISSION_RATE=${PLATFORM_COMMISSION_RATE:-0.12}
            PHOTON_BASE_URL=${PHOTON_BASE_URL:-https://photon.komoot.io}
            OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
            GEO_USER_AGENT=${GEO_USER_AGENT:-SafarisCon/1.0 (geo-proxy)}
            GEO_TIMEOUT_MS=${GEO_TIMEOUT_MS:-8000}
            GEO_PROVIDER=${GEO_PROVIDER:-photon}
            GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
            XENTRIPAY_ENV=${XENTRIPAY_ENV:-test}
            XENTRIPAY_API_KEY=${XENTRIPAY_API_KEY}
            XENTRIPAY_BASE_URL=${XENTRIPAY_BASE_URL}
            XENTRIPAY_CURRENCY=${XENTRIPAY_CURRENCY:-RWF}
            XENTRIPAY_MIN_AMOUNT=${XENTRIPAY_MIN_AMOUNT:-100}
            XENTRIPAY_CHARGES_INCLUDED=${XENTRIPAY_CHARGES_INCLUDED:-true}
            XENTRIPAY_MERCHANT_NAME=${XENTRIPAY_MERCHANT_NAME:-SafarisCon}
            XENTRIPAY_MERCHANT_EMAIL=${XENTRIPAY_MERCHANT_EMAIL}
            XENTRIPAY_MERCHANT_PHONE=${XENTRIPAY_MERCHANT_PHONE}
            XENTRIPAY_COLLECTION_REDIRECT_URL=${XENTRIPAY_COLLECTION_REDIRECT_URL}
            XENTRIPAY_COLLECTION_RETURN_URL=${XENTRIPAY_COLLECTION_RETURN_URL}
            XENTRIPAY_CHECKOUT_FINAL_URL=${XENTRIPAY_CHECKOUT_FINAL_URL}
            XENTRIPAY_SIMULATE_SUCCESS=${XENTRIPAY_SIMULATE_SUCCESS:-false}
            MAILER_HOST=${MAILER_HOST}
            MAILER_PORT=${MAILER_PORT}
            MAILER_PRODUCER_EMAIL=${MAILER_PRODUCER_EMAIL}
            MAILER_PRODUCER_PASSWORD=${MAILER_PRODUCER_PASSWORD}
            MAILER_REJECT_UNAUTHORIZED=${MAILER_REJECT_UNAUTHORIZED}
            EOF
            chmod 600 .env
            docker compose pull || true
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
            docker compose logs --tail=80 api
